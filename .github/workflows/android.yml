name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: mkdir www && cp index.html game.js www/
      - run: npx cap add android
      - name: Lock landscape
        run: sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk vampre.apk
      - uses: actions/upload-artifact@v4
        with: { name: vampre-apk, path: vampre.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: vampre.apk }
